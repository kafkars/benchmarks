[package]
name = "kafkars-benchmark-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
bytes = "1.10"
kafkars = { path = "../../../kafka-client/crates/kafka-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
