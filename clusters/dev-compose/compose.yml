# Three-broker KRaft cluster for local diagnostics.
#
# Extracted from the kafka-client smoke cluster, with one deliberate change:
# the host ports default to 39092-39094 instead of being required. The upstream
# copy is launched by a harness that always sets them; this one is launched by
# a human typing `docker compose ... up -d --wait`, and a compose file that
# refuses to start without three env vars is a compose file people stop using.
# The defaults sit high enough to avoid a stock local broker on 9092.
#
# Three brokers with RF=3 / min.insync.replicas=2 is not decoration: a
# single-broker cluster acknowledges `acks=all` the instant it writes locally,
# so producer measurements taken against one would omit replication entirely
# and flatter the client. Auto topic creation stays off so the harness owns
# topic geometry, and the fixed heap keeps the JVM from resizing mid-run.
x-kafka-environment: &kafka-environment
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_NUM_PARTITIONS: "1"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_LOG_SEGMENT_DELETE_DELAY_MS: "0"
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms1G -Xmx1G}

x-kafka-healthcheck: &kafka-healthcheck
  test:
    - CMD-SHELL
    - >-
      /opt/kafka/bin/kafka-broker-api-versions.sh
      --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1
  interval: 1s
  timeout: 5s
  retries: 90
  start_period: 10s

x-kafka-service: &kafka-service
  image: apache/kafka:4.3.1
  init: true
  restart: "no"
  healthcheck: *kafka-healthcheck
  stop_grace_period: 30s

services:
  kafka-1:
    <<: *kafka-service
    hostname: kafka-1
    ports:
      - "127.0.0.1:${KAFKA_1_HOST_PORT:-39092}:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://127.0.0.1:${KAFKA_1_HOST_PORT:-39092}

  kafka-2:
    <<: *kafka-service
    hostname: kafka-2
    ports:
      - "127.0.0.1:${KAFKA_2_HOST_PORT:-39093}:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://127.0.0.1:${KAFKA_2_HOST_PORT:-39093}

  kafka-3:
    <<: *kafka-service
    hostname: kafka-3
    ports:
      - "127.0.0.1:${KAFKA_3_HOST_PORT:-39094}:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://127.0.0.1:${KAFKA_3_HOST_PORT:-39094}
