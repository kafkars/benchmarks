# The pull-request pack: one scenario, once.
#
# Format
# ------
#
#   name         identifier used in logs and report titles
#   cadence      which schedule this pack belongs to; prose, not a trigger
#   description  what a reader should conclude from a complete run of the pack
#
#   [[entries]]
#   scenario     path to a scenario TOML, relative to the repository root
#   repetitions  how many attempts of that scenario the pack asks for
#
# Entries run in the order written. Nothing else is declared here: bootstrap
# servers, subject binaries, seeds, and the results root belong to the invoking
# command, not to the pack, so the same pack describes a laptop run and a CI
# run.
#
# `benchctl pack --manifest scenarios/packs/pr.toml ...` runs this file. Each
# entry dispatches to the verb its repetition count implies: two or more is a
# suite, one is a run, and one over a scenario carrying a `[search]` section is
# a capacity ladder. Scenario paths are repository-root-relative, so the command
# is run from the repository root.
#
# Why one scenario: a pull request gate must fail for reasons the author
# changed. Cross-client throughput on a shared runner is noisy enough that a
# hard gate on it would mostly report the runner. This pack exists to prove the
# whole path still works end to end — resolve, spawn, produce, verify, seal —
# not to compare clients.

name = "pr"
cadence = "pull request"
description = "One balanced producer attempt: proves the harness runs and seals, gates nothing on the numbers."

[[entries]]
scenario = "scenarios/producer/headline/balanced-1k-12p.toml"
repetitions = 1
