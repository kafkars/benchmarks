# The nightly pack: every headline scenario three times, plus one capacity
# search.
#
# Format
# ------
#
#   name         identifier used in logs and report titles
#   cadence      which schedule this pack belongs to; prose, not a trigger
#   description  what a reader should conclude from a complete run of the pack
#
#   [[entries]]
#   scenario     path to a scenario TOML, relative to the repository root
#   repetitions  how many attempts of that scenario the pack asks for
#
# Entries run in the order written. Nothing else is declared here: bootstrap
# servers, subject binaries, seeds, and the results root belong to the invoking
# command, not to the pack, so the same pack describes a laptop run and a CI
# run.
#
# There is no `benchctl pack` runner yet. Until there is, a pack is a reviewed
# statement of which scenarios belong to a cadence, and a caller loops over the
# entries with `benchctl run` (and `benchctl capacity` for the search entry).
# See `docs/ROADMAP.md`.
#
# Three repetitions is the design document's nightly cadence. It is enough to
# see a regression and not enough to support a claim: the statistical design
# asks for five paired blocks before a confidence interval means anything, so
# a nightly report describes and does not decide.
#
# The capacity search runs once because it is already repeated internally —
# three repetitions per candidate rate — and because it is by far the longest
# entry. It goes last so that a pack that runs out of time still produced every
# fixed point.
#
# Entry order otherwise walks the payload axis upward, so the cheap scenarios
# fail fast: a broken build surfaces on the 128-byte floor rather than after
# the 900 KB run has written a gigabyte.

name = "nightly"
cadence = "nightly"
description = "The full producer headline set at three repetitions each, followed by one balanced capacity search."

[[entries]]
scenario = "scenarios/producer/headline/latency-floor-128b-1p.toml"
repetitions = 3

[[entries]]
scenario = "scenarios/producer/headline/balanced-1k-12p.toml"
repetitions = 3

[[entries]]
scenario = "scenarios/producer/headline/fanout-1k-96p.toml"
repetitions = 3

[[entries]]
scenario = "scenarios/producer/headline/overload-1k-12p.toml"
repetitions = 3

[[entries]]
scenario = "scenarios/producer/headline/payload-16k-12p.toml"
repetitions = 3

[[entries]]
scenario = "scenarios/producer/headline/payload-256k-6p.toml"
repetitions = 3

[[entries]]
scenario = "scenarios/producer/headline/near-limit-900k-3p.toml"
repetitions = 3

[[entries]]
scenario = "scenarios/producer/headline/capacity-balanced-1k-12p.toml"
repetitions = 1
