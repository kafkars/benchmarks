# The design document's producer parameter matrix, kept as a reference and NOT
# as a runnable scenario.
#
# `benchctl resolve --experiment scenarios/producer/producer-baseline.toml`
# fails on purpose, and it should: every value below is a *list* of settings to
# sweep, while an executable scenario states one setting per key. The scenario
# schema is deny-unknown-fields precisely so that a document like this one
# cannot be mistaken for something a harness read.
#
# What it is for: naming the axes the headline set does and does not cover.
# `scenarios/DEFERRED.md` walks every row that is missing, says which specific
# thing refuses it today, and names the change that would unblock it. The
# runnable set is `scenarios/producer/headline/`.
name = "producer-baseline"
duration_seconds = 120
warmup_seconds = 30

[cluster]
partitions = [1, 12, 96]
replication_factor = 3
security = ["plaintext", "tls"]

[producer]
payload_bytes = [128, 1024, 16384, 262144, 1048576]
application_threads = [1, 4, 16]
keyed = [false, true]
acks = "all"
idempotence = true
compression = ["none", "lz4", "zstd"]
profiles = ["low-latency", "balanced", "throughput"]

[measure]
throughput_records = true
throughput_bytes = true
latency_percentiles = [50.0, 95.0, 99.0]
application_cpu = true
broker_cpu = true
rss_bytes = true
allocations = true
batch_sizes = true
request_count = true
retries = true
