# Continuous integration for the benchmark lab.
#
# Read this before adding a lane, because the thing this workflow is careful
# NOT to do is the whole design: **no job here measures performance.** Hosted
# runners are shared, throttled, and neighboured by other people's builds. A
# throughput or p99 number produced on one is not evidence about kafkars, and
# publishing it as though it were would poison exactly the artifact this
# repository exists to protect. CI proves the *harness* is correct, buildable,
# and deterministic; real numbers come from controlled hardware, sealed into
# evidence bundles, and are claim-eligible only when provenance is strict-clean.
#
# What each lane proves — and does not:
#
#   workspace             Proves the Rust control plane compiles at the MSRV,
#                         is formatted, is clippy-clean under -D warnings, its
#                         unit tests pass, the source tree still matches the
#                         content-bound zrail policy — file-size ratchets,
#                         package layers, declarative facades, module contracts,
#                         test siblings, and no async runtime
#                         in the harness's own lock file — every schema file
#                         parses and is registered, and the librdkafka pin reads
#                         the same in all seven places it is written down —
#                         including the cache key this file uses below. Proves
#                         NOTHING about the adapters, which are separate
#                         workspaces, or about any run against a real broker.
#
#   control-plane         Proves the migrated Node control plane's own tests
#                         pass under the pinned Node, and that the model-summary
#                         request the nightly would send still matches the
#                         reviewed prompt artifact — prompt version, defaults,
#                         packet digest, and a strict schema mirroring
#                         kafkars.llm-summary.v1 — with no network, no API key,
#                         and no build. Proves NOTHING about its ability to
#                         drive a cluster, and nothing about what a model
#                         replies; those paths are exercised by the diagnostic
#                         lane, the nightly workflow, and local runs.
#
#   adapters-conformance  The lane that earns its 35 minutes. Proves both
#                         adapters build --locked against the REVIEWED sibling
#                         revisions (not against whatever main happens to be),
#                         and that the Rust and C implementations agree
#                         byte-for-byte with the committed conformance vectors.
#                         That is determinism and wire agreement, NOT speed and
#                         NOT behaviour under load: two adapters can agree on
#                         every vector and still differ wildly in throughput.
#
#   quality-gate          Proves every lane above actually reported success.
#                         It exists so branch protection has exactly ONE
#                         required check: the lane list is then an
#                         implementation detail of this file, and adding a lane
#                         never requires a settings change to be enforced.
#                         `if: always()` is load-bearing — without it a
#                         cancelled or skipped lane produces a vacuous green.
#
#   diagnostic            The PR-pack cadence: stands up the three-broker dev
#                         cluster and runs `benchctl pack` over
#                         scenarios/packs/pr.toml — one balanced attempt through
#                         the real verb surface — to prove the plumbing survives
#                         a real broker. It runs on pull requests and on
#                         workflow_dispatch, and it is `continue-on-error: true`
#                         and absent from quality-gate.needs, which together are
#                         the whole argument: its numbers are shared-runner
#                         numbers, useful for "did it run" and inadmissible as a
#                         performance claim, so it must be able to fail without
#                         blocking a merge. The sibling repositories are public,
#                         so forks can run the same pinned checkout without a
#                         repository secret. Never a PR gate; never required by
#                         branch protection.
#
# Branch protection: require `quality-gate` only.
#
# Every third-party action is pinned to a 40-hex commit, with the tag it
# resolved to in a trailing comment (dependabot proposes bumps; a human reads
# the diff). `persist-credentials: false` everywhere: nothing in this workflow
# pushes, and a checkout that leaves a usable token in .git/config turns any
# script we invoke into a potential write path.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out benchmarks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./.github/actions/setup-rust
      # zrail 0.0.1 has its own Rust 1.96 source floor. Installing it with an
      # explicit secondary toolchain keeps the benchmark workspace on its
      # reviewed Rust 1.88 compiler.
      - name: Install the zrail toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install pinned zrail
        run: cargo +1.96.0 install zrail --version 0.0.1 --locked
      # Fetch once, up front, so the check scripts can stay offline-friendly
      # and a network blip reads as a fetch failure rather than a lint failure.
      - name: Fetch reviewed dependencies
        run: cargo fetch --locked
      - name: Validate the workspace
        run: scripts/check-workspace
      # Runs beside the workspace lane rather than inside it: the guardrails are
      # a policy over the source tree and the resolved lock file, not a property
      # of a compiled artifact, and a separate step keeps a budget violation
      # legible as one instead of buried in a test sweep.
      - name: Validate the source-shape and dependency guardrails
        run: scripts/check-guardrails
      - name: Validate the schema registry
        run: scripts/check-schemas
      # Cheap, needs no toolchain, and guards the cache key used by the two
      # jobs below: the librdkafka version and checksum are written down in
      # seven places and nothing else notices when a bump misses one.
      - name: Validate the librdkafka pin
        run: scripts/check-librdkafka-pin

  control-plane:
    name: control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out benchmarks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # package-manager-cache is off deliberately: this repository has no
      # lockfile to key a cache on, and the control plane has no dependencies.
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Validate the legacy control plane
        run: scripts/check-control-plane
      # python3 is preinstalled on ubuntu-24.04, and this test needs nothing
      # else: it drives the summary script's --dry-run against a committed
      # fixture, so it reaches no network and builds nothing. It lives in this
      # lane rather than in workspace because it is a script contract, not a
      # Rust one.
      - name: Validate the model-summary request contract
        run: scripts/benchmark-openai-summary-test

  adapters-conformance:
    name: adapters-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # This checkout lives at kafka-benchmarks/ so the sibling repositories can
    # be materialized next to it, reproducing the developer layout that the
    # adapter path deps and environment capture already assume.
    defaults:
      run:
        working-directory: kafka-benchmarks
    steps:
      - name: Check out benchmarks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kafka-benchmarks
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./kafka-benchmarks/.github/actions/setup-rust
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Check out reviewed sibling dependencies
        uses: ./kafka-benchmarks/.github/actions/checkout-siblings
      # The cache key is the librdkafka version plus the first bytes of the
      # reviewed source checksum, and nothing else: that pair fully determines
      # the cached bytes, so there are deliberately no restore-keys — a partial
      # match here would mean building against unreviewed sources. The runner
      # image is part of the contract too; if this job ever leaves ubuntu-24.04,
      # the key must change with it. A cache miss is never fatal: the bootstrap
      # script re-downloads and re-verifies the checksum, which remains the
      # actual trust boundary.
      #
      # The key duplicates the pin in scripts/bootstrap-librdkafka, and that
      # duplication is what scripts/check-librdkafka-pin exists to guard: it
      # asserts this key still tracks the bootstrap pin, so a bump that changes
      # the script but not this line fails the workspace lane instead of
      # silently serving a build of the previous source.
      - name: Restore the reviewed librdkafka build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            kafka-benchmarks/target/benchmarks/downloads
            kafka-benchmarks/target/benchmarks/librdkafka-*
          key: librdkafka-2.15.0-259015220c
      - name: Fetch reviewed adapter dependencies
        run: cargo fetch --manifest-path adapters/kafkars/Cargo.toml --locked
      - name: Build adapters and verify conformance vectors
        run: scripts/check-benchmarks

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [workspace, control-plane, adapters-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect every evidence lane
        env:
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          CONTROL_PLANE_RESULT: ${{ needs['control-plane'].result }}
          ADAPTERS_CONFORMANCE_RESULT: ${{ needs['adapters-conformance'].result }}
        run: |
          failures=0
          check_result() {
            if [[ "$2" != success ]]; then
              echo "$1 evidence lane ended with: $2" >&2
              failures=$((failures + 1))
            fi
          }
          check_result workspace "$WORKSPACE_RESULT"
          check_result control-plane "$CONTROL_PLANE_RESULT"
          check_result adapters-conformance "$ADAPTERS_CONFORMANCE_RESULT"
          test "$failures" -eq 0

  diagnostic:
    name: diagnostic
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    # Non-gating by construction. This lane exists to notice that the harness
    # stopped being able to run at all; it is not evidence, and it must never be
    # the reason a correct change cannot merge. `quality-gate` does not list it
    # in `needs`, and this flag keeps a red diagnostic from turning the whole
    # workflow run red.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kafka-benchmarks
    env:
      BOOTSTRAP: 127.0.0.1:39092,127.0.0.1:39093,127.0.0.1:39094
      PACK_INPUTS: target/pr-pack-inputs
    steps:
      - name: Check out benchmarks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kafka-benchmarks
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: ./kafka-benchmarks/.github/actions/setup-rust
      - name: Install pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      # The reviewed sibling repositories are public, so this exact pinned
      # stack is available to pull requests from forks without a repository
      # secret.
      - name: Check out reviewed sibling dependencies
        uses: ./kafka-benchmarks/.github/actions/checkout-siblings
      # The same key the conformance lane uses, guarded by the same
      # scripts/check-librdkafka-pin: the librdkafka version plus the first
      # bytes of the reviewed source checksum fully determine the cached bytes,
      # so there are deliberately no restore-keys.
      - name: Restore the reviewed librdkafka build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            kafka-benchmarks/target/benchmarks/downloads
            kafka-benchmarks/target/benchmarks/librdkafka-*
          key: librdkafka-2.15.0-259015220c
      - name: Fetch reviewed dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path adapters/kafkars/Cargo.toml --locked
      # The shared generator builds the adapters and the release control plane
      # and writes the two per-machine inputs, exactly as
      # scripts/bench-suite-acceptance and the nightly do. Building here rather
      # than inside the pack step keeps a compile failure legible as one, and
      # means the cluster is not started for a run that was never going to
      # happen.
      - name: Build the adapters and the control plane
        run: scripts/generate-subject-config "$PACK_INPUTS" "$BOOTSTRAP"
      # --wait blocks on the compose healthchecks, so a broker that never
      # becomes reachable fails here with a cluster error instead of surfacing
      # later as an unexplained producer timeout.
      - name: Start the dev cluster
        run: docker compose -f clusters/dev-compose/compose.yml up -d --wait
      # The reviewed PR pack, through the real verb surface, rather than the
      # legacy comparison script: what this lane is for is proving that the
      # thing a person runs still runs.
      - name: Run the pull-request pack
        run: |
          target/release/benchctl pack \
            --manifest scenarios/packs/pr.toml \
            --subjects "$PACK_INPUTS/subjects.toml" \
            --cluster "$PACK_INPUTS/cluster.toml" \
            --bootstrap "$BOOTSTRAP" \
            --results results \
            --reports reports
      # The bundle is the point of this lane. It is uploaded even on failure,
      # because a partial bundle explains the failure; if-no-files-found stays
      # at warn so a missing bundle never masks the upstream error that caused
      # it. Retention is bounded: these are shared-runner diagnostics, not
      # claim-eligible evidence, and should not accumulate as if they were.
      - name: Upload the evidence bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-bundle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            kafka-benchmarks/results/
            kafka-benchmarks/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Stop the dev cluster
        if: ${{ always() }}
        run: docker compose -f clusters/dev-compose/compose.yml down --volumes --remove-orphans
