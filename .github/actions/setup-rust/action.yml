# Install one explicitly named Rust toolchain through immutable action code.
#
# The default is the workspace MSRV and MUST stay in sync with `rust-version`
# in the root Cargo.toml and the channel in rust-toolchain.toml. Benchmark
# evidence is only comparable across runs when the compiler is a constant, so
# the toolchain is a reviewed input here, never "whatever rustup resolved".
# A caller that wants a different compiler passes `toolchain:` explicitly and
# says why in its job comment.
name: Set up Rust
description: Install the reviewed Rust toolchain for the benchmark lab.

inputs:
  toolchain:
    description: Exact Rust toolchain version to install.
    required: false
    default: "1.88.0"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-07-16
      with:
        toolchain: ${{ inputs.toolchain }}
        components: rustfmt, clippy
