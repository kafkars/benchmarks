[package]
name = "bench-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned evidence documents, canonical JSON, and benchmark identities"
publish = false

[lints]
workspace = true

# `serde_json` is deliberately taken without the `preserve_order` feature: this
# crate's canonical bytes are byte-sorted because the map type behind
# `serde_json::Value` is a `BTreeMap`, and a feature that swaps it for an
# insertion-ordered map would silently change every identity this crate
# computes. A guard test fails if that ever happens through feature
# unification.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
