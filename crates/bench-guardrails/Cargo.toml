[package]
name = "bench-guardrails"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executable source-shape and dependency policy for the benchmark workspace"
publish = false

[lints]
workspace = true

# This crate links nothing that could reach a broker, a socket, or a clock. It
# reads `guardrails.toml`, walks the source tree, and reads `Cargo.lock`, so
# `toml` and `serde` are the entire dependency set and are the same pair every
# other human-authored input in this workspace is parsed by.
[dependencies]
serde = { workspace = true }
toml = { workspace = true }
